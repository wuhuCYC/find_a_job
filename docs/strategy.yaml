# 补强作品（按优先级；2026-09-24 按「主线金融科技、副线量化」重排）
portfolio:
  - title: SaaS 金融级升级
    summary: Postgres 迁移、Docker、CI；复式账本 + 幂等 API + 日终对账；部署到 AWS
    helps: [fintech_swe, investment_analytics]
  - title: Java 限价订单簿 + 撮合引擎
    summary: 价格-时间优先、部分成交、行情回放；JMH 基准与延迟分位数
    helps: [trading_systems, quant_dev, fintech_swe]
  - title: 严谨的研究报告
    summary: 用公开数据（美股 / 加密）重跑信号框架：nested walk-forward、成本、试了多少组参数、deflated Sharpe、因子调整后 alpha、失败的信号
    helps: [quant_dev, quant_research, investment_analytics]
  - title: 信贷评分卡
    summary: 公开贷款数据；评分卡 vs GBM、跨时间验证、PSI、SHAP 理由码、公平性检验
    helps: [risk_data]
  - title: 固收小工具库
    summary: 收益率曲线 bootstrap、久期 / 凸性、关键利率久期
    helps: [investment_analytics, quant_dev]

