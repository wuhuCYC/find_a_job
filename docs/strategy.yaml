next_steps:
  - OPT 交上去之后：保存收据通知（I-797C）上的案件号，在 USCIS 网站查进度；批准、拿到 EAD 卡之前不能开始工作
  - 主线马上投：Acorns、Experian、PennyMac、Zest AI、Tala 和远程的金融科技后端岗；资管的 SDE / 投资数据工程岗一起投
  - 副线量化：固定每周的业余时间做研究报告（补强作品第 3 个），只精投资管的量化开发岗
  - 每天手写代码不用 AI（LeetCode + 重写自己系统的核心模块），把面试手感练回来
  - 部署到 VPS 后跑 bash deploy/deploy_vps.sh check，看国内服务器能连上哪些招聘接口
  - 找 UCI 校友内推：PIMCO、Capital Group、Experian、Pacific Life
  - 轮换私有仓库里泄露的 token；把本仓库改成 private

questions:
  - 简历核实：分布式数据库、前端框架到底用的哪个；各项百分比和日交易量怎么测的；CRDDC 排名是比赛期间还是事后对照
  - 美国简历用的邮箱和手机号、LinkedIn；知合科技和道路病害项目的结束月份
  - I-20 上 OPT 推荐（Employment Authorizations 一栏）写的开始日期：EAD 从这天或批准日里较晚的那天开始
  - EECS 215 项目里你负责的部分（数据准备 / HMM / 特征选择 / 序列模型 / 评估 / 干预验证）

# 量化 vs 金融科技（回答 2026-09-24 的提问）
quant_vs_fintech:
  intro: 两者都和钱打交道。量化是拿钱去市场里博弈赚钱，金融科技是做让别人用钱的产品。
  rows:
    - {label: 做什么, quant: 用数据、统计和代码直接在市场里赚钱：找信号、做策略、搭研究和交易系统, fintech: 用软件做金融产品和服务：投资 App、支付、借贷、征信、银行系统}
    - {label: 典型雇主, quant: 对冲基金、做市商、资管的量化团队（PIMCO、Capital Group 量化岗、Crabel）, fintech: Acorns、Experian、Zest AI、Tala、PennyMac、Robinhood、Coinbase}
    - {label: 岗位, quant: 量化研究（找信号）· 量化开发（搭回测和交易基础设施）· 交易员, fintech: 后端 / 全栈工程师 · 数据工程 · 风控建模}
    - {label: 怎么衡量你, quant: 研究和策略能不能赚钱（P&L），系统是否可靠, fintech: 产品和系统做得好不好：用户、稳定性、合规}
    - {label: 面试考什么, quant: 概率统计、脑筋急转弯、Python / C++ 手写代码、项目深挖, fintech: LeetCode、系统设计、行为面}
    - {label: 薪资, quant: 上限最高；资管量化开发约 $120–195K，顶级基金 $200–300K, fintech: 普通软件工程水平；南加州应届约 $90–160K}
    - {label: 机会, quant: 名额少、门槛高；顶级公司集中在纽约 / 芝加哥，远程少, fintech: 岗位多、远程多、签证担保更常见}
    - {label: 对你, quant: 最贴近你的兴趣（投机、博弈）；回测和事件研究是直接相关的证据, fintech: 你已经有 100+ 付费用户的产品，这是现在最硬的证据}
  middle: 中间地带是资管公司的技术岗（PIMCO / Capital Group 的 SDE、投资数据工程）、交易平台（Robinhood、Coinbase）和信贷风控建模：做的是工程，但天天和市场数据、交易打交道。
  decision: 你的选择（2026-09-24）：主线金融科技，副线量化开发。
  advice: OPT 的失业计时从 EAD 开始日算起，所以建议两条线并行：金融科技和资管技术岗先拿到工作，赶上 H-1B 抽签；量化方向靠研究报告等作品持续积累。从资管技术岗内部转量化开发，是很常见的路径。

