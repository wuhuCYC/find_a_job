  Rust: ["\\brust\\b"]
  R: ["\\br\\b(?:\\s+programming|\\s+language|,|/)"]
  SAS: ["\\bsas\\b"]
  kdb+: ["\\bkdb\\+?", "\\bq/kdb"]
  pandas: ["\\bpandas\\b"]
