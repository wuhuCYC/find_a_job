# ============================================================================
# 目标公司表（2026-09 调研）。详细分析见 docs/TARGET_COMPANIES.md
#
# tier：1 = 最优先（地点对 + 和钱直接相关 + 有新人岗/担保记录）；2 = 值得投；3 = 兜底/观察
# ats：抓取方式
#   greenhouse {token} / lever {site} / ashby {org} / smartrecruiters {company_id, country}
#   workday {host, tenant, site} / icims {portal}（实验）/ jobvite {company}（实验）/ manual（只能手动看官网）
# verified：ATS 配置是否在调研中从真实招聘链接里确认过。false 的请先跑 `python -m jobhunt check`
# search_terms：只对 workday 生效；职位特别多的公司用关键词缩小范围（删掉则抓全部）
# map_city / group：网站地图用的落点城市和分组（可选，默认从 hq / category 推断）
# ============================================================================

