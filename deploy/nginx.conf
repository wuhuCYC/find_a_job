# 方式 B（海外服务器 + 自己的域名）：/etc/nginx/sites-available/jobhunt
# 必须加密码：页面里有你的简历素材和签证时间线（生成方法见 deploy/README.md）
# 方式 A（和 SaaS 同一台 VPS）不用这个文件，用 nginx-jobs.conf
server {
    listen 443 ssl http2;
    server_name jobs.example.com;

    # 证书（例如 certbot --nginx 自动写入）
    # ssl_certificate     /etc/letsencrypt/live/jobs.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/jobs.example.com/privkey.pem;

    auth_basic "jobhunt";
    auth_basic_user_file /etc/nginx/.jobhunt_htpasswd;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host 127.0.0.1;   # 应用只接受本机 Host；对外的门禁是上面的密码
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;   # 定制简历要调用 Claude，给足时间
    }
}

server {
    listen 80;
    server_name jobs.example.com;
    return 301 https://$host$request_uri;
}
