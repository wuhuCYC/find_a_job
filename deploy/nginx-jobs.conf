# 求职台挂在已有 HTTPS 站点的 /jobs/ 子路径下。
# remote_setup.sh 把它装到 /etc/nginx/snippets/jobhunt.conf，再由 nginx_include.py 在 443 的 server 块里加一行 include。
# 页面里有简历素材和签证时间线，必须带密码（/etc/nginx/.jobhunt_htpasswd）。
location = /jobs { return 301 /jobs/; }

# ^~：不让站点里的正则 location（比如静态文件缓存规则）抢走 /jobs/ 下的请求
location ^~ /jobs/ {
    auth_basic "jobhunt";
    auth_basic_user_file /etc/nginx/.jobhunt_htpasswd;

    proxy_pass http://127.0.0.1:8765/;
    proxy_http_version 1.1;
    # 应用只接受本机 Host；对外的门禁是上面的密码
    proxy_set_header Host 127.0.0.1;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 300s;
    client_max_body_size 1m;
    add_header X-Robots-Tag "noindex, nofollow" always;
}
