  - id: uci_mr_collaboration
    kind: research
    title: Predicting Intervention Timing in Mixed-Reality Collaboration
    role: Team project (4 members), EECS 215 Data Mining & Modeling, UC Irvine   # TODO 写清你负责的部分
    location: Irvine, CA
    start: 2025-09
    end: 2025-12
    url: https://github.com/LilyLiu945/MR-Collaboration-Intervention
    stack: [Python, pandas, NumPy, scikit-learn, hmmlearn, TensorFlow]
    facts:
      - id: f_data
        text: >-
          Per-second multimodal behavioral features (speaking entropy, dominance ratio, joint
          attention, proximity) and network metrics for 12 collaborating groups; team of 4.
        source: MR-Collaboration-Intervention README.md, workflow.md
      - id: f_method
        text: >-
          Gaussian HMM (hmmlearn) for latent coordination states; supervised feature selection
          (mutual information, RFE, LassoCV); LSTM, GRU and Transformer classifiers in
          TensorFlow/Keras compared with Random Forest; group-level split of 8/2/2 groups for
          train/validation/test to prevent leakage; imbalanced minority class.
        source: MR-Collaboration-Intervention src/, workflow.md
      - id: f_result_caveat
        text: >-
          Held-out accuracy 0.82 was below the 0.89 majority-class rate (164 of 185 windows negative),
          so accuracy/F1 should not be quoted as a result.
        source: results/reports/final_evaluation_report.txt
    bullets:
      - id: mr.hmm
        label: HMM 隐状态建模
        text: >-
          Modeled team-collaboration dynamics from per-second multimodal features (speaking entropy,
          dominance, joint attention, proximity) with a Gaussian HMM to uncover latent coordination
          states.
        facts: [f_data, f_method]
        weights: {risk_data: 3, quant_research: 2, quant_dev: 1}
      - id: mr.sequence_models
        label: 序列模型对比 + 防泄漏切分
        text: >-
          Compared LSTM, GRU and Transformer sequence classifiers (TensorFlow/Keras) with a Random
          Forest, using group-level train/validation/test splits (8/2/2 groups) to prevent leakage
          across sessions.
        facts: [f_method]
        weights: {risk_data: 3, quant_research: 2, quant_dev: 1}
      - id: mr.feature_selection
        label: 特征选择与类别不平衡
        text: >-
          Ran supervised feature selection (mutual information, RFE, Lasso) and handled class
          imbalance for rare "intervention-needed" windows.
        facts: [f_method]
        weights: {risk_data: 2, quant_research: 1}
