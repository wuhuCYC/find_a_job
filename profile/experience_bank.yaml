  - id: cs2_market_platform
    kind: project
    title: CS2 Item Market Research & Signal Platform
    role: Independent project
    location: ""
    start: 2026-03
    end: present          # TODO 确认；如果已停更改成 2026-07
    url: ""               # 私有仓库；公开前务必清理 token（见 docs/PROJECT_PACKAGING.md）
    stack: [Python, pandas, NumPy, JavaScript, REST APIs, Parquet, Linux, SQLite]
    facts:
      - id: f_scale
        text: >-
          Python + JavaScript codebase of about 57K lines (47,738 Python + 9,860 JS, 170 files,
          counted 2026-07-02): ~48K lines of Python and ~10K lines of JS.
        source: csgo-agent@v6-phase2-3-stats-buypoints
      - id: f_universe
        text: >-
          Daily OHLCV store for 2,430 instruments with up to 1,099 daily bars (~3 years); listing
          (supply) and buy-order (demand) daily history for 2,012 items; monitored universe expanded
          to all 1,892 weapon skins; earlier 918-item watchlist with ~1,010 bars each.
        source: csgo-agent docs/PROJECT_STATUS.md (V5.1, V20), zhuang_trapped/HANDOFF.md
      - id: f_walkforward
        text: >-
          Walk-forward 70/30 train/test backtest over the 918-item watchlist; price-tier-specific
          signal weights lifted the out-of-sample hit rate (7-day return >= 8%) of alerted signals
          (score >= 55) from 24.5% to 29.5%; test signals 2,077 -> 3,274; an anomalous rally window
          was excluded.
        source: csgo-agent docs/PROJECT_STATUS.md V5.1 (2026-03-12)
      - id: f_methodology_fix
        text: >-
          Backtest methodology audit (2026-04-12): made correlated "quiet consolidation" features
          mutually exclusive (max stacked score 83 -> 25), extended per-item cooldown from 7 to 14
          days to reduce overlapping samples, excluded a full bull-run window, and used price-tier
          success thresholds.
        source: csgo-agent commit 6ae8ac4
      - id: f_event_study
        text: >-
          Pullback-to-cost event signal made real-time (signal day = pullback confirmation day,
          no look-ahead): 13,671 events across 1,190 instruments over 3 years. 14-day hit rate 46.0%
          vs 33.3% for a placebo "ordinary dip" signal and 29.0% for the all-days baseline; +11 to
          +16 percentage points in every price tier; 30-day hit rate 52.0% vs 41.9%. Edge vanished
          during a market-structure shock (43.5% vs placebo 44.9%). Stop-loss overlays lowered hit
          rates by 2-5 percentage points.
        source: csgo-agent analysis/zhuang_trapped/HANDOFF.md (v0.3, 2026-06-09)
      - id: f_paper_trading
        text: >-
          Paper-trading harness: several signal sources plus a random-entry control group (1 random
          trade per day from the same pool), 1 unit per trade, 7-day trade-hold constraint, two-stage
          exits (reduce half, then exit). July 2026 review: monthly returns ranged from +10.9% to
          -14.4% and random entries beat all 11 signal sources in the recent regime, so a
          market-regime gate became the top priority.
        source: csgo-agent analysis/paper_trader.py, docs/PROJECT_STATUS.md (2026-07-02)
      - id: f_volume_radar
        text: >-
          Abnormal-volume radar over 1,651 instruments: volume ratio >= 3x, classified into 5 classes
          by price position and candle direction; matched 6/6 hand-labeled ground-truth cases.
        source: csgo-agent docs/PROJECT_STATUS.md V20
      - id: f_signal_log
        text: >-
          Daily automated scans (launchd / cron) with Telegram alerts; append-only signal log that
          back-fills realized 7/14/30-day returns for every alert and feeds dashboard win-rate stats.
        source: csgo-agent V6 Phase 1
      - id: f_dashboard
        text: >-
          Dashboard: Python HTTP server with 20+ REST endpoints and modular JS; candlestick charts,
          signal badges, sector heatmap; sector cohesion measured by median pairwise Pearson
          correlation.
        source: csgo-agent V5.2 / V6 Phase 4
      - id: f_holder_tracking
        text: >-
          Large-holder tracking: diffs public Steam inventory snapshots across many accounts into a
          ledger; separates one-shot storage transfers from incremental real trades.
        source: csgo-agent V20 steam_inventory_watch
      - id: f_state_machine
        text: >-
          Eight-phase market-cycle state machine (base, accumulation, shakeout, markup, platform,
          second markup, distribution, breakdown) driving a buy-zone scanner over 982 items.
        source: csgo-agent V19
      - id: f_ops
        text: >-
          Operations: catch-up chain after power loss, self-healing boot jobs, VPS sync and a written
          runbook.
        source: csgo-agent V20
    bullets:
      - id: cs2.event_study
        label: 事件研究 vs 安慰剂 / 基线
        text: >-
          Turned a discretionary pullback-to-cost-basis setup into a look-ahead-free event signal and
          tested it on 13,671 events across 1,190 instruments over 3 years: 14-day hit rate of 46.0%
          vs. 33.3% for a placebo dip signal and 29.0% for the unconditional baseline.
        facts: [f_event_study]
        weights: {quant_research: 3, quant_dev: 3, risk_data: 3, investment_analytics: 2, marketplace_econ: 2}
      - id: cs2.regime_risk
        label: 分 regime 与止损压力测试
        text: >-
          Stress-tested that edge by regime and exit rule: it disappeared during a market-structure
          shock (43.5% vs. 44.9% placebo), and stop-loss overlays cut hit rates by 2–5 percentage
          points, which changed how the signal is used.
        facts: [f_event_study]
        weights: {quant_research: 3, quant_dev: 2, risk_data: 2, investment_analytics: 1}
      - id: cs2.paper_trading
        label: 纸面交易 + 随机对照组
        text: >-
          Built a paper-trading harness with a random-entry control group, a 7-day trade-hold
          constraint and two-stage exits; when random entries beat all 11 signal sources in a weak
          regime, used the result to prioritize a market-regime gate over adding new signals.
        facts: [f_paper_trading]
        weights: {quant_research: 3, quant_dev: 3, trading_systems: 1, risk_data: 2, investment_analytics: 2}
      - id: cs2.methodology_fix
        label: 回测方法论自我审计
