  # ==========================================================================
  - id: cs2_market_platform
    kind: project
    title: CS2 Item Market Research & Signal Platform
    role: Independent project
    location: ""
    start: 2026-03
    end: present          # TODO 确认；如果已停更改成 2026-07
    url: ""               # 私有仓库；公开前务必清理 token（见 docs/PROJECT_PACKAGING.md）
    stack: [Python, pandas, NumPy, JavaScript, REST APIs, Parquet, Linux, SQLite]
    facts:
      - id: f_scale
        text: >-
          Python + JavaScript codebase of about 57K lines (47,738 Python + 9,860 JS, 170 files,
          counted 2026-07-02): ~48K lines of Python and ~10K lines of JS.
        source: csgo-agent@v6-phase2-3-stats-buypoints
      - id: f_universe
        text: >-
          Daily OHLCV store for 2,430 instruments with up to 1,099 daily bars (~3 years); listing
          (supply) and buy-order (demand) daily history for 2,012 items; monitored universe expanded
          to all 1,892 weapon skins; earlier 918-item watchlist with ~1,010 bars each.
        source: csgo-agent docs/PROJECT_STATUS.md (V5.1, V20), zhuang_trapped/HANDOFF.md
      - id: f_walkforward
        text: >-
          Walk-forward 70/30 train/test backtest over the 918-item watchlist; price-tier-specific
          signal weights lifted the out-of-sample hit rate (7-day return >= 8%) of alerted signals
          (score >= 55) from 24.5% to 29.5%; test signals 2,077 -> 3,274; an anomalous rally window
          was excluded.
        source: csgo-agent docs/PROJECT_STATUS.md V5.1 (2026-03-12)
      - id: f_methodology_fix
        text: >-
          Backtest methodology audit (2026-04-12): made correlated "quiet consolidation" features
          mutually exclusive (max stacked score 83 -> 25), extended per-item cooldown from 7 to 14
          days to reduce overlapping samples, excluded a full bull-run window, and used price-tier
          success thresholds.
        source: csgo-agent commit 6ae8ac4
      - id: f_event_study
        text: >-
          Pullback-to-cost event signal made real-time (signal day = pullback confirmation day,
          no look-ahead): 13,671 events across 1,190 instruments over 3 years. 14-day hit rate 46.0%
          vs 33.3% for a placebo "ordinary dip" signal and 29.0% for the all-days baseline; +11 to
          +16 percentage points in every price tier; 30-day hit rate 52.0% vs 41.9%. Edge vanished
          during a market-structure shock (43.5% vs placebo 44.9%). Stop-loss overlays lowered hit
          rates by 2-5 percentage points.
        source: csgo-agent analysis/zhuang_trapped/HANDOFF.md (v0.3, 2026-06-09)
      - id: f_paper_trading
        text: >-
          Paper-trading harness: several signal sources plus a random-entry control group (1 random
          trade per day from the same pool), 1 unit per trade, 7-day trade-hold constraint, two-stage
          exits (reduce half, then exit). July 2026 review: monthly returns ranged from +10.9% to
          -14.4% and random entries beat all 11 signal sources in the recent regime, so a
          market-regime gate became the top priority.
        source: csgo-agent analysis/paper_trader.py, docs/PROJECT_STATUS.md (2026-07-02)
      - id: f_volume_radar
        text: >-
          Abnormal-volume radar over 1,651 instruments: volume ratio >= 3x, classified into 5 classes
          by price position and candle direction; matched 6/6 hand-labeled ground-truth cases.
        source: csgo-agent docs/PROJECT_STATUS.md V20
      - id: f_signal_log
        text: >-
          Daily automated scans (launchd / cron) with Telegram alerts; append-only signal log that
          back-fills realized 7/14/30-day returns for every alert and feeds dashboard win-rate stats.
        source: csgo-agent V6 Phase 1
      - id: f_dashboard
        text: >-
          Dashboard: Python HTTP server with 20+ REST endpoints and modular JS; candlestick charts,
          signal badges, sector heatmap; sector cohesion measured by median pairwise Pearson
          correlation.
        source: csgo-agent V5.2 / V6 Phase 4
      - id: f_holder_tracking
        text: >-
          Large-holder tracking: diffs public Steam inventory snapshots across many accounts into a
          ledger; separates one-shot storage transfers from incremental real trades.
        source: csgo-agent V20 steam_inventory_watch
      - id: f_state_machine
        text: >-
          Eight-phase market-cycle state machine (base, accumulation, shakeout, markup, platform,
          second markup, distribution, breakdown) driving a buy-zone scanner over 982 items.
        source: csgo-agent V19
      - id: f_ops
        text: >-
          Operations: catch-up chain after power loss, self-healing boot jobs, VPS sync and a written
          runbook.
        source: csgo-agent V20
    bullets:
      - id: cs2.event_study
        text: >-
          Turned a discretionary pullback-to-cost-basis setup into a look-ahead-free event signal and
          tested it on 13,671 events across 1,190 instruments over 3 years: 14-day hit rate of 46.0%
          vs. 33.3% for a placebo dip signal and 29.0% for the unconditional baseline.
        facts: [f_event_study]
        weights: {quant_research: 3, quant_dev: 3, risk_data: 3, investment_analytics: 2, marketplace_econ: 2}
      - id: cs2.regime_risk
        text: >-
          Stress-tested that edge by regime and exit rule: it disappeared during a market-structure
          shock (43.5% vs. 44.9% placebo), and stop-loss overlays cut hit rates by 2–5 percentage
          points, which changed how the signal is used.
        facts: [f_event_study]
        weights: {quant_research: 3, quant_dev: 2, risk_data: 2, investment_analytics: 1}
      - id: cs2.paper_trading
        text: >-
          Built a paper-trading harness with a random-entry control group, a 7-day trade-hold
          constraint and two-stage exits; when random entries beat all 11 signal sources in a weak
          regime, used the result to prioritize a market-regime gate over adding new signals.
        facts: [f_paper_trading]
        weights: {quant_research: 3, quant_dev: 3, trading_systems: 1, risk_data: 2, investment_analytics: 2}
      - id: cs2.methodology_fix
        text: >-
          Audited my own backtests: removed double-counted correlated features (max stacked score
          83 → 25), lengthened cooldowns from 7 to 14 days to reduce overlapping samples, and
          excluded an anomalous bull-run window from evaluation.
        facts: [f_methodology_fix]
        weights: {quant_research: 3, quant_dev: 2, risk_data: 3, investment_analytics: 1}
      - id: cs2.walkforward
        text: >-
          Ran walk-forward (70/30) backtests; price-tier-specific feature weights raised the
          out-of-sample hit rate (7-day return ≥ 8%) of alerted signals from 24.5% to 29.5% on 3,274
          test signals.
        facts: [f_walkforward]
        weights: {quant_research: 2, quant_dev: 2, risk_data: 2, marketplace_econ: 1}
      - id: cs2.data_platform
        text: >-
          Built the data layer for a Steam CS2 item-market research platform: ~3 years of daily OHLCV
          for 2,430 instruments plus daily listing (supply) and buy-order (demand) history for 2,012
          items, with rate-limited collectors, local caching and atomic writes.
        facts: [f_universe]
        weights: {quant_dev: 3, investment_analytics: 3, fintech_swe: 1, marketplace_econ: 3, risk_data: 1}
      - id: cs2.scale
        text: >-
          Grew the system to a ~48K-line Python codebase (plus a ~10K-line JS dashboard) covering
          signal scanners, a market-cycle state machine, backtests and daily automation.
        facts: [f_scale, f_state_machine]
        weights: {quant_dev: 1, fintech_swe: 1, trading_systems: 1}
      - id: cs2.signal_log
        text: >-
          Closed the loop from research to production with scheduled daily scans, Telegram alerts,
          and an append-only signal log that back-fills realized 7/14/30-day returns for every alert.
        facts: [f_signal_log]
        weights: {quant_dev: 2, trading_systems: 3, fintech_swe: 2, investment_analytics: 2}
      - id: cs2.volume_radar
        text: >-
          Implemented an abnormal-volume radar over 1,651 instruments that flags ≥3× volume spikes and
          classifies them by price position and candle direction.
        facts: [f_volume_radar]
        weights: {trading_systems: 2, quant_dev: 1, marketplace_econ: 2}
      - id: cs2.dashboard
        text: >-
          Shipped a research dashboard (Python HTTP server, 20+ REST endpoints, modular JS) with
          candlestick charts, signal-performance badges and sector heatmaps based on median pairwise
          Pearson correlation.
        facts: [f_dashboard]
        weights: {fintech_swe: 2, investment_analytics: 2, quant_dev: 1}
      - id: cs2.market_model
        text: >-
          Modeled supply and demand in a virtual-goods market — listings, buy orders and large-holder
          inventories — by diffing public Steam inventory snapshots across many accounts into a
          holdings ledger.
        facts: [f_holder_tracking, f_universe]
        weights: {marketplace_econ: 3, risk_data: 1}

  # ==========================================================================
  - id: equity_signal_platform
    kind: project
    title: Equity Swing-Trading Signal & Backtesting Platform (China A-shares)
    role: Independent project
    location: ""
    start: 2026-03
    end: 2026-05
    url: ""
    stack: [Python, pandas, NumPy, Optuna, FastAPI, WebSocket, APScheduler, SQLite, Parquet, JavaScript, pytest, REST APIs]
    facts:
      - id: f_scale
        text: About 16K lines of Python (16,046 counted) with 89 unit tests (pytest).
        source: a-stock-signal-v2@main (2026-05-27)
      - id: f_universe
        text: >-
          Universe of 5,000+ A-share stocks; 5,201 stocks mapped to Shenwan L1/L2 industries (99.6%
          L2 coverage); about 100 industry sectors and 4 major indices.
        source: a-stock-signal-v2 CLAUDE.md, docs/PROJECT_STATUS.md, CHANGELOG Phase B
      - id: f_signals
        text: >-
          21 buy signals (15 positive across 3 phases + 6 negative/risk) and 6 sell signals, all
          vectorized in pandas; derived features lagged with shift(1); trades executed at next open.
        source: a-stock-signal-v2 CLAUDE.md
      - id: f_filters
        text: >-
          Top-down 3-layer filter: market regime with 4 states (bull / range / bear / crash; crash
          stops scanning) -> sector rating with 5 multipliers from 0.50 to 1.15 -> stock scoring with
          phase-chain multipliers.
        source: a-stock-signal-v2 CLAUDE.md
      - id: f_constraints
        text: >-
          Board adapter for price-limit bands (main board 10%, ChiNext/STAR 20%, Beijing SE 30%, ST
          stocks 5%) and T+1 settlement awareness; no hard-coded percentage thresholds in signals.
        source: a-stock-signal-v2 CLAUDE.md, memory feedback_dont_exclude_st
      - id: f_backtest
        text: >-
          Backtester: next-open execution, limit-up/limit-down fill handling, forced liquidation;
          max 10 positions, max 20% per stock, 1M CNY starting capital; commissions 0.03% buy /
          0.08% sell plus 3-tier slippage; 3 exit strategies (fixed-day, stop-loss/take-profit,
          trailing stop); report with win rate, profit/loss ratio, profit factor, max drawdown,
          Sharpe ratio, annualized return and monthly distribution.
        source: a-stock-signal-v2 docs/PROJECT_STATUS.md Phase 5
      - id: f_evolution
        text: >-
          Optuna TPE search (200 trials by default) scored on training and validation windows; rolling
          walk-forward validation with 6-month train / 2-month validation; new parameters observed for
          2 weeks; parameter versions move through new -> observing -> active -> retired.
        source: a-stock-signal-v2 evolution/, CLAUDE.md
      - id: f_realtime
        text: >-
          Intraday sell monitor polls quotes for held stocks every 6 seconds; URGENT alerts
          (stop-loss, trailing stop, heavy-volume drop, support break) vs NORMAL (holding period,
          fading volume); 60-minute de-duplication; end-of-day digest; watches 5-15 holdings.
        source: a-stock-signal-v2 CLAUDE.md, signals/sell/monitor.py
      - id: f_service
        text: >-
          FastAPI + WebSocket service with APScheduler jobs and a single-page dashboard; two SQLite
          databases (shared market data vs per-user data) to avoid write-lock contention; every user
          query scoped by user_id for JWT multi-tenancy.
        source: a-stock-signal-v2 CLAUDE.md
      - id: f_data
        text: >-
          Tushare Pro data (daily bars, chip distribution, shareholder counts, top-trader lists,
          margin balances, money flow) behind a local Parquet cache with incremental updates, atomic
          writes, request spacing and exponential backoff.
        source: a-stock-signal-v2 .claude/memory/feedback_kline_local_cache.md, CLAUDE.md
    bullets:
      - id: eq.platform
        text: >-
          Built an end-to-end equity signal research platform in Python (~16K LOC, 89 unit tests)
          covering 5,000+ China A-share stocks: incremental data pipeline, 21 vectorized buy signals,
          and a top-down market-regime → sector → stock filter.
        facts: [f_scale, f_universe, f_signals, f_filters]
        weights: {quant_dev: 3, quant_research: 2, investment_analytics: 3, fintech_swe: 1, trading_systems: 1}
      - id: eq.backtester
        text: >-
          Wrote an event-driven backtester with next-open execution, limit-up/limit-down fill
          handling, position caps (10 names, ≤20% each), asymmetric commissions and tiered slippage;
          reports Sharpe ratio, max drawdown, profit factor and monthly P&L.
        facts: [f_backtest]
        weights: {quant_dev: 3, quant_research: 3, trading_systems: 2, investment_analytics: 3, risk_data: 1}
      - id: eq.optuna
        text: >-
          Automated parameter search with Optuna (TPE) under rolling walk-forward validation (6-month
          train / 2-month validation) and promoted parameter sets through a versioned lifecycle
          (new → observing → active → retired).
        facts: [f_evolution]
        weights: {quant_dev: 3, quant_research: 2, risk_data: 2, investment_analytics: 1}
      - id: eq.bias_controls
        text: >-
          Guarded against look-ahead bias by lagging every derived feature and executing at the next
          open, and encoded market rules (T+1 settlement, 10/20/30% board price limits) in one adapter
          instead of hard-coded thresholds.
        facts: [f_signals, f_constraints]
        weights: {quant_research: 3, quant_dev: 2, trading_systems: 1, risk_data: 1}
      - id: eq.realtime_monitor
        text: >-
          Implemented an intraday risk monitor that polls quotes for held positions every 6 seconds
          and raises stop-loss, trailing-stop, heavy-volume-drop and support-break alerts with
          severity levels and 60-minute de-duplication.
        facts: [f_realtime]
        weights: {trading_systems: 3, fintech_swe: 2, quant_dev: 2, risk_data: 1}
      - id: eq.buy_slow_sell_fast
        text: >-
          Split the system into an end-of-day batch scan of 5,000+ stocks and a real-time monitor for
          5–15 holdings, with independent schedulers, data frequencies and failure isolation.
        facts: [f_universe, f_realtime]
        weights: {trading_systems: 3, quant_dev: 1, fintech_swe: 1}
      - id: eq.service
        text: >-
          Served signals through FastAPI and WebSocket with APScheduler jobs; split SQLite stores
          (shared market data vs. per-user data) to remove write-lock contention and scoped every user
          query for JWT multi-tenancy.
        facts: [f_service]
        weights: {fintech_swe: 3, trading_systems: 2, quant_dev: 1}
      - id: eq.data_layer
        text: >-
          Integrated market, positioning and fund-flow datasets (chip distribution, shareholder
          counts, margin balances, top-trader lists) behind a cached, incremental Parquet layer with
          atomic writes and exponential backoff.
        facts: [f_data]
        weights: {investment_analytics: 3, quant_dev: 2, risk_data: 2, quant_research: 1}
      - id: eq.sector_mapping
        text: >-
          Mapped 5,201 stocks to Shenwan L1/L2 industries (99.6% L2 coverage) and aggregated
          constituents into sector ratings that scale stock scores by 0.50–1.15.
        facts: [f_universe, f_filters]
        weights: {investment_analytics: 3, quant_research: 1, quant_dev: 1}

