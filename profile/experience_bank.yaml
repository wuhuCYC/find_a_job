        source: a-stock-signal-v2 CLAUDE.md, docs/PROJECT_STATUS.md, CHANGELOG Phase B
      - id: f_signals
        text: >-
          21 buy signals (15 positive across 3 phases + 6 negative/risk) and 6 sell signals, all
          vectorized in pandas; derived features lagged with shift(1); trades executed at next open.
        source: a-stock-signal-v2 CLAUDE.md
      - id: f_filters
        text: >-
          Top-down 3-layer filter: market regime with 4 states (bull / range / bear / crash; crash
          stops scanning) -> sector rating with 5 multipliers from 0.50 to 1.15 -> stock scoring with
          phase-chain multipliers.
        source: a-stock-signal-v2 CLAUDE.md
      - id: f_constraints
        text: >-
          Board adapter for price-limit bands (main board 10%, ChiNext/STAR 20%, Beijing SE 30%, ST
          stocks 5%) and T+1 settlement awareness; no hard-coded percentage thresholds in signals.
        source: a-stock-signal-v2 CLAUDE.md, memory feedback_dont_exclude_st
      - id: f_backtest
        text: >-
          Backtester: next-open execution, limit-up/limit-down fill handling, forced liquidation;
          max 10 positions, max 20% per stock, 1M CNY starting capital; commissions 0.03% buy /
          0.08% sell plus 3-tier slippage; 3 exit strategies (fixed-day, stop-loss/take-profit,
          trailing stop); report with win rate, profit/loss ratio, profit factor, max drawdown,
          Sharpe ratio, annualized return and monthly distribution.
        source: a-stock-signal-v2 docs/PROJECT_STATUS.md Phase 5
      - id: f_evolution
        text: >-
          Optuna TPE search (200 trials by default) scored on training and validation windows; rolling
          walk-forward validation with 6-month train / 2-month validation; new parameters observed for
          2 weeks; parameter versions move through new -> observing -> active -> retired.
        source: a-stock-signal-v2 evolution/, CLAUDE.md
      - id: f_realtime
        text: >-
          Intraday sell monitor polls quotes for held stocks every 6 seconds; URGENT alerts
          (stop-loss, trailing stop, heavy-volume drop, support break) vs NORMAL (holding period,
          fading volume); 60-minute de-duplication; end-of-day digest; watches 5-15 holdings.
        source: a-stock-signal-v2 CLAUDE.md, signals/sell/monitor.py
      - id: f_service
        text: >-
          FastAPI + WebSocket service with APScheduler jobs and a single-page dashboard; two SQLite
          databases (shared market data vs per-user data) to avoid write-lock contention; every user
