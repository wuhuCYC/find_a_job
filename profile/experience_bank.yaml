# ============================================================================
# 经历素材库（Experience Bank）— 所有简历版本的唯一事实来源
# ============================================================================
#
# 规则（tailor 程序会强制执行，见 jobhunt/guard.py）：
#   1. 每条 bullet 都必须是真的、你能在面试里讲 5 分钟的。
#   2. bullet 里出现的每个数字，都必须能在它引用的 facts 里找到（数字守卫）。
#   3. 定制简历只能「挑选 / 重排 / 改写措辞」，不能新增事实、数字或技术栈。
#   4. weights：0-3，越高越适合放进该方向的简历；0 或不写 = 不放。
#   5. 标了 TODO 的地方需要你补充或确认；确认后删掉 TODO 字样。
#
# 岗位方向（archetype）定义见 config/archetypes.yaml：
#   quant_dev            量化开发 / 研究工程师
#   quant_research       量化研究 / 量化分析
#   trading_systems      交易系统 / 实时系统工程师
#   fintech_swe          金融科技后端 / 全栈工程师
#   risk_data            风控 / 信贷 / 数据科学
#   investment_analytics 资管投资数据 / 组合分析工程师
#   marketplace_econ     交易市场 / 虚拟经济 / 定价分析
#
# 注意：这个文件是「简历级」内容，可以给雇主看。
#       策略阈值、私有参数、API token 一律不写进来。
# ============================================================================

version: 1

# 每个方向一句话定位（tailor 会在此基础上按 JD 微调，但不会新增事实）
summaries:
  quant_dev: >-
    MS EECS candidate at UC Irvine who builds trading research infrastructure end to end —
    data pipelines, vectorized signal libraries, cost-aware backtesters and walk-forward
    parameter search — mainly in Python, with Java experience.
  quant_research: >-
    MS EECS candidate at UC Irvine who turns market intuition into testable event signals and
    judges them against placebo and random-entry baselines, out of sample and by regime.
  trading_systems: >-
    MS EECS candidate at UC Irvine who has shipped scheduled and real-time market-monitoring
    services — polling, alerting, de-duplication and failure isolation — for live trading decisions.
  fintech_swe: >-
    MS EECS candidate at UC Irvine who has built and deployed a multi-user fintech-style SaaS
    (Flask, React, JWT auth, paid tiers, background jobs, 375 automated tests) plus trading data systems.
  risk_data: >-
    MS EECS candidate at UC Irvine with hands-on experience in feature engineering, event studies,
    out-of-sample validation and time-series classification on market and behavioral data.
  investment_analytics: >-
    MS EECS candidate at UC Irvine who builds investment data pipelines, sector and regime analytics
    and performance reporting (Sharpe, drawdown, attribution by tier) for trading research.
  marketplace_econ: >-
    MS EECS candidate at UC Irvine who has spent a year modeling a real virtual-goods market —
    supply, demand, large-holder inventories and price cycles — with production data systems.

